<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Bakso Raden</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 500px;
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      font-size: 1.125rem;
      margin-bottom: 2rem;
      opacity: 0.9;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: #fff;
      color: #667eea;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .features {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .features h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .feature-list {
      list-style: none;
      text-align: left;
      display: inline-block;
    }

    .feature-list li {
      padding: 0.5rem 0;
      opacity: 0.8;
    }

    .feature-list li:before {
      content: "✓ ";
      margin-right: 0.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Anda Sedang Offline</h1>
    <p>
      Sepertinya koneksi internet Anda terputus. Beberapa fitur mungkin tidak tersedia saat offline.
    </p>
    <a href="/" class="btn" onclick="window.location.reload()">Coba Lagi</a>

    <div class="features">
      <h2>Yang Masih Bisa Anda Lakukan:</h2>
      <ul class="feature-list">
        <li>Lihat produk yang sudah di-cache</li>
        <li>Lihat keranjang belanja Anda</li>
        <li>Browse halaman yang pernah dikunjungi</li>
      </ul>
    </div>
  </div>

  <script>
    // Auto retry when online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
